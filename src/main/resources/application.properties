spring.config.import=optional:file:./src/main/resources/secrets.properties

# Logging
logging.level.com.mtcc=INFO
logging.level.io.qdrant.client.QdrantClient=OFF

# Qdrant
QDRANT.HOST=localhost
QDRANT.GRPC.PORT=6334
QDRANT.INDEXING.THRESHOLD=20000
QDRANT.SEARCH.TOP.K=20
QDRANT.SEARCH.MIN.SCORE=0
QDRANT.SEARCH.HYBRID.ENABLED=true
QDRANT.SEARCH.PREFETCH.LIMIT=20

# Ollama
OLLAMA.BASE.URL=http://localhost:11434
OLLAMA.EMBEDDING.MODEL.NAME=qwen3-embedding:0.6b
OLLAMA.EMBEDDING.QUERY.PREFIX=Instruct: Given a question about a software project, retrieve the source code, documentation and configuration that answer it\nQuery:
OLLAMA.EMBEDDING.PASSAGE.PREFIX=
OLLAMA.GENERAL.PURPOSE.MODEL.NAME=llama3.1:8b
OLLAMA.CODING.MODEL.NAME=qwen2.5-coder:1.5b
OLLAMA.JUDGE.MODEL.NAME=phi4:14b

# Embeddings
EMBEDDING.PROVIDER=in-process
EMBEDDING.MAX.THREADS=0

# Reranking
RERANK.PROVIDER=in-process
RERANK.TOP.K=8
RERANK.MODEL.PATH=../onnx/model.onnx
RERANK.TOKENIZER.PATH=../onnx/tokenizer.json

# RAG search
RAG.SEARCH.MAX.CHUNK.CHARS=1500
RAG.SEARCH.WEAK.SCORE=3

# Agents
AGENT.LOG.REQUESTS=false
AGENT.LOG.RESPONSES=false

# Guardrails
GUARDRAILS.ENABLED=true
GUARDRAILS.SELF.CHECK.ENABLED=false
GUARDRAILS.MAX.INPUT.CHARS=10000
GUARDRAILS.TOPICS=the software projects in the knowledge base (their source code, documentation, configuration and architecture)
SECRETS.REDACTION.ENABLED=true

# Langfuse
LANGFUSE.HOST=http://localhost:3000
LANGFUSE.TRACING.ENABLED=true

# Evaluation
EVALUATION.DEFAULT.DATASET=datasets/spring-ai-security-golden-dataset_v2.json
EVALUATION.MAX.SOURCES.CHARS=12000
EVALUATION.CONCURRENCY=4

# Github
GITHUB.CLONE.DEPTH=1
GITHUB.CLONE.ALL.BRANCHES=false

# Ingestion
INGESTION.BATCH.SIZE=75
INGESTION.BATCH.TIMEOUT.SECONDS=5
INGESTION.MAX.BUFFERED.BATCHES=5000
INGESTION.DEMO.REPOSITORIES=https://github.com/spring-projects/spring-security.git,\
  https://github.com/spring-projects/spring-ai.git

# Chunking
CODE.FILE.EXTENSIONS=aj, bat, c, cc, cpp, cs, css, ddl, go, gradle, graphql, groovy, h, hpp, hsx, htm, html, java,\
  js, jsx, kt, kts, php, py, rb, rs, scala, sh, sql, swift, tld, ts, tsx, xsd, xsl
DOCS.FILE.EXTENSIONS=md, txt, adoc, asciidoc, rst
CONFIG.FILE.EXTENSIONS=properties, conf, json, xml, yaml, yml
TEXT.CHUNK.MAX.CHARS=1500
PROJECT.TREE.MAX.DEPTH=3
SUMMARY.MAX.MODULES=40
SUMMARY.MODULE.MAX.DEPTH=3
SUMMARY.MAX.INPUT.CHARS=12000

# I/O
IGNORE.HIDDEN.FILES.AND.FOLDERS=true
PROJECTS.DOWNLOAD.FOLDER=target/projects