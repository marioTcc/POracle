services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 2
      QDRANT__STORAGE__WAL__WAL_CAPACITY_MB: 1024
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16g
        reservations:
          memory: 4g
    networks:
      - ai-network

volumes:
  qdrant_data:

networks:
  ai-network:
    name: ai-network
